name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Check the metadata
        run: uv run --locked twine check dist/*

      - name: Fail when the release tag and the package version disagree
        if: github.event_name == 'release'
        shell: bash
        run: |
          wheel=$(basename dist/*.whl)
          built_version=${wheel#mi_fitness_sync-}
          built_version=${built_version%-py3-none-any.whl}
          if [ "v${built_version}" != "${GITHUB_REF_NAME}" ] && [ "${built_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match the built version ${built_version}." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    # A manual run only verifies the build; PyPI is written only for a published release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mi-fitness-sync
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
